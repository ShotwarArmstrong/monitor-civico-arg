<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cívico Argentina - Base Visual</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            /* Fondo con degradado institucional celeste y blanco */
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 50%, #bae6fd 100%);
        }

        /* Patrón de fondo con estrellas espaciadas y soles de mayo intercalados */
        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.08;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><text x="40" y="80" font-size="32" fill="%23ffb81c">☀️</text><text x="180" y="200" font-size="30" fill="%2374acdf">⭐⭐⭐</text></svg>');
            background-repeat: repeat;
        }

        #header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            border: 2px solid #74acdf;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .flag-icon { width: 24px; height: 24px; }
        #header h1 { margin: 0; font-size: 1.3em; color: #0f172a; }
        #header p { margin: 2px 0 0 0; font-size: 0.8em; color: #0284c7; font-weight: 600; }

        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        #map-svg {
            height: 84vh;
            max-width: 90vw;
            filter: drop-shadow(0px 10px 25px rgba(0,0,0,0.15));
        }

        /* Estilo visual inicial limpio para las provincias basado en el mapa de referencia */
        .provincia {
            stroke: #1e293b;
            stroke-width: 1.2;
            transition: fill 0.2s ease;
        }
    </style>
</head>
<body>

    <div class="background-pattern"></div>

    <div id="header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg" class="flag-icon" alt="Arg">
        <div>
            <h1>Monitor Cívico Argentina</h1>
            <p>Estructura Base - Jurisdicciones Nacionales</p>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg" class="flag-icon" alt="Arg">
    </div>

    <div id="map-container">
        <!-- Mapa vectorial unificado con la forma real de Argentina y CABA integrada -->
        <svg id="map-svg" viewBox="0 0 500 950" xmlns="http://www.w3.org/2000/svg">
            <g id="mapa-argentina">
                <!-- Jujuy -->
                <path class="provincia" fill="#fde047" d="M 195,45 L 235,40 L 245,85 L 200,95 Z" />
                <!-- Salta -->
                <path class="provincia" fill="#38bdf8" d="M 155,80 L 200,95 L 245,85 L 290,95 L 280,155 L 195,145 L 155,115 Z" />
                <!-- Formosa -->
                <path class="provincia" fill="#bae6fd" d="M 290,95 L 380,115 L 365,150 L 280,150 Z" />
                <!-- Tucumán -->
                <path class="provincia" fill="#7dd3fc" d="M 180,145 L 215,148 L 210,178 L 175,172 Z" />
                <!-- Catamarca -->
                <path class="provincia" fill="#fde047" d="M 130,125 L 180,145 L 175,172 L 210,190 L 190,230 L 125,185 Z" />
                <!-- Chaco -->
                <path class="provincia" fill="#38bdf8" d="M 280,150 L 365,150 L 345,210 L 260,200 Z" />
                <!-- Santiago del Estero -->
                <path class="provincia" fill="#1e40af" d="M 195,145 L 280,150 L 260,200 L 210,240 L 185,185 Z" />
                <!-- Misiones -->
                <path class="provincia" fill="#38bdf8" d="M 400,155 L 445,145 L 460,195 L 415,215 Z" />
                <!-- Corrientes -->
                <path class="provincia" fill="#fde047" d="M 345,210 L 415,215 L 395,285 L 320,265 Z" />
                <!-- Santa Fe -->
                <path class="provincia" fill="#38bdf8" d="M 260,200 L 320,265 L 305,370 L 255,365 L 235,260 Z" />
                <!-- La Rioja -->
                <path class="provincia" fill="#38bdf8" d="M 125,185 L 190,230 L 175,275 L 110,250 Z" />
                <!-- San Juan -->
                <path class="provincia" fill="#fde047" d="M 110,250 L 175,275 L 160,335 L 95,310 Z" />
                <!-- Córdoba -->
                <path class="provincia" fill="#fde047" d="M 190,230 L 260,200 L 235,260 L 255,365 L 195,360 L 175,275 Z" />
                <!-- Entre Ríos -->
                <path class="provincia" fill="#7dd3fc" d="M 320,265 L 395,285 L 370,360 L 305,370 Z" />
                <!-- San Luis -->
                <path class="provincia" fill="#bae6fd" d="M 160,335 L 195,360 L 185,425 L 135,410 Z" />
                <!-- Mendoza -->
                <path class="provincia" fill="#1e40af" d="M 95,310 L 160,335 L 135,410 L 90,385 Z" />
                <!-- La Pampa -->
                <path class="provincia" fill="#38bdf8" d="M 185,425 L 255,365 L 245,460 L 180,445 Z" />
                
                <!-- Provincia de Buenos Aires -->
                <path class="provincia" fill="#1e40af" d="M 255,365 L 305,370 L 370,360 L 355,475 L 280,545 L 195,475 L 245,460 Z" />
                
                <!-- CABA (Ciudad Autónoma de Buenos Aires - Integrada y visible claramente dentro de Buenos Aires) -->
                <polygon class="provincia" fill="#16a34a" points="305,360 335,360 338,390 308,390" />

                <!-- Neuquén -->
                <path class="provincia" fill="#fde047" d="M 90,385 L 135,410 L 125,490 L 75,475 Z" />
                <!-- Río Negro -->
                <path class="provincia" fill="#38bdf8" d="M 125,490 L 245,460 L 265,550 L 115,545 Z" />
                <!-- Chubut -->
                <path class="provincia" fill="#1e40af" d="M 115,545 L 265,550 L 245,660 L 100,650 Z" />
                <!-- Santa Cruz -->
                <path class="provincia" fill="#fde047" d="M 100,650 L 245,660 L 215,785 L 85,775 Z" />
                <!-- Tierra del Fuego -->
                <path class="provincia" fill="#fde047" d="M 135,815 L 205,825 L 190,865 L 125,855 Z" />
                
                <!-- Islas Malvinas -->
                <g id="islas-malvinas">
                    <path class="provincia" fill="#38bdf8" d="M 315,715 L 335,709 L 330,739 L 310,735 Z" />
                    <path class="provincia" fill="#38bdf8" d="M 345,725 L 370,719 L 365,755 L 340,749 Z" />
                </g>
            </g>
        </svg>
    </div>

</body>
</html>
