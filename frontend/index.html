<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cívico Argentina</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0284c7;
            --bg: #0b0f19;
            --card-bg: #131c31;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
        }

        /* Encabezado */
        #header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(19, 28, 49, 0.9);
            padding: 12px 25px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #header h1 { margin: 0; font-size: 1.2em; letter-spacing: 0.5px; color: #fff; }
        #header p { margin: 2px 0 0 0; font-size: 0.75em; color: var(--text-muted); }

        /* Mapa autónomo (sin tiles externas mundiales) */
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
            background: #070a12;
        }

        /* Panel lateral de información */
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 380px;
            max-height: calc(100vh - 40px);
            z-index: 1000;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow-y: auto;
            display: none;
            border: 1px solid var(--border);
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-muted);
        }
        .close-btn:hover { color: #fff; }
        .province-title { margin: 0 0 15px 0; color: #38bdf8; font-size: 1.4em; }

        /* Pestañas */
        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.85em;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
            font-weight: bold;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .metric-box {
            background: #0b0f19;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            text-align: center;
            border: 1px solid var(--border);
        }
        .metric-val { font-size: 1.8em; font-weight: bold; color: #f43f5e; }
        .metric-sub { font-size: 0.75em; color: var(--text-muted); text-transform: uppercase; }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.88em;
        }
        .history-list { list-style: none; padding: 0; margin: 10px 0 0 0; font-size: 0.85em; }
        .history-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border); }
    </style>
</head>
<body>

    <div id="header">
        <h1>Monitor Cívico Argentina</h1>
        <p>Mapa de Riesgo Integral y Transparencia Pública</p>
    </div>

    <div id="map"></div>

    <div id="info-panel">
        <span class="close-btn" onclick="cerrarPanel()">&times;</span>
        <h2 id="panel-nombre" class="province-title">-</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-general')">General & Riesgo</button>
            <button class="tab-btn" onclick="switchTab('tab-empleo')">Empleo & Economía</button>
            <button class="tab-btn" onclick="switchTab('tab-seguridad')">Seguridad & Salud</button>
        </div>

        <!-- Pestaña 1: General -->
        <div id="tab-general" class="tab-content active">
            <div class="metric-box">
                <div id="panel-riesgo" class="metric-val">- / 100</div>
                <div class="metric-sub">Índice de Riesgo Integral</div>
            </div>
            <div class="data-row"><span>Población Total:</span><strong id="panel-poblacion">-</strong></div>
            <div class="data-row"><span>Tasa de Pobreza:</span><strong id="panel-pobreza">-</strong></div>
        </div>

        <!-- Pestaña 2: Empleo -->
        <div id="tab-empleo" class="tab-content">
            <div class="data-row"><span>Costo Promedio Alquiler (2 amb):</span><strong id="panel-alquiler">-</strong></div>
            <div style="font-weight: bold; margin: 15px 0 8px 0; font-size: 0.9em; color: #38bdf8;">Evolución del Desempleo:</div>
            <ul id="panel-historial" class="history-list"></ul>
        </div>

        <!-- Pestaña 3: Seguridad y Salud -->
        <div id="tab-seguridad" class="tab-content">
            <div class="data-row"><span>Tasa de Inseguridad (c/ 100k hab):</span><strong id="panel-inseguridad">-</strong></div>
            <div class="data-row"><span>Tasa de Mortalidad:</span><strong id="panel-mortalidad">-</strong></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa centrado exclusivamente en Argentina con límites estrictos
        let map = L.map('map', {
            zoomControl: false,
            minZoom: 4,
            maxZoom: 8,
            maxBounds: [[-56.0, -75.0], [-21.0, -51.0]]
        }).setView([-38.416097, -63.616672], 5);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let datosProvincias = {};
        let geojsonLayer = null;

        // Cálculo del Índice de Riesgo General (0 a 100) combinando factores
        function calcularIndiceRiesgo(p) {
            if (!p) return 50;
            const pobr = p.pobreza_porcentaje || 40;
            const desempleo = (p.desempleo_historial && p.desempleo_historial[0]) ? p.desempleo_historial[0].tasa : 6;
            const inseguridad = (p.inseguridad_tasa || 500) / 15; // normalizado
            
            // Ponderación integral
            let score = (pobr * 0.5) + (desempleo * 2.5) + (inseguridad * 0.2);
            return Math.min(Math.max(Math.round(score), 10), 100);
        }

        // Escala de colores de Verde a Rojo basada en el Índice de Riesgo
        function getColorPorRiesgo(score) {
            return score > 75 ? '#991b1b' : // Rojo oscuro crítico
                   score > 60 ? '#dc2626' : // Rojo
                   score > 45 ? '#f97316' : // Naranja
                   score > 30 ? '#eab308' : // Amarillo
                   '#16a34a';               // Verde (menor riesgo)
        }

        function style(feature) {
            const nombre = feature.properties.nam || feature.properties.name;
            const provData = datosProvincias[nombre];
            const riesgo = calcularIndiceRiesgo(provData);

            return {
                fillColor: getColorPorRiesgo(riesgo),
                weight: 1.5,
                opacity: 1,
                color: '#ffffff',
                dashArray: '3',
                fillOpacity: 0.8
            };
        }

        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 3,
                color: '#38bdf8',
                dashArray: '',
                fillOpacity: 0.95
            });
            layer.bringToFront();
        }

        function resetHighlight(e) {
            if (geojsonLayer) geojsonLayer.resetStyle(e.target);
        }

        function seleccionarProvincia(e) {
            const feature = e.target.feature;
            const nombreProv = feature.properties.nam || feature.properties.name;
            const data = datosProvincias[nombreProv];

            const panel = document.getElementById('info-panel');
            if (data) {
                const riesgoScore = calcularIndiceRiesgo(data);
                document.getElementById('panel-nombre').innerText = data.nombre;
                document.getElementById('panel-riesgo').innerText = `${riesgoScore} / 100`;
                document.getElementById('panel-poblacion').innerText = `${data.poblacion.toLocaleString('es-AR')} hab.`;
                document.getElementById('panel-pobreza').innerText = `${data.pobreza_porcentaje}%`;
                document.getElementById('panel-alquiler').innerText = `$${data.costo_alquiler.toLocaleString('es-AR')}`;
                document.getElementById('panel-inseguridad').innerText = `${data.inseguridad_tasa} delitos`;
                document.getElementById('panel-mortalidad').innerText = `${data.mortalidad_tasa} ‰`;

                let historialHTML = '';
                if (data.desempleo_historial) {
                    historialHTML = data.desempleo_historial.map((item, index) => {
                        const etiqueta = index === 0 ? `Año ${item.anio} (Actual)` : `Hace ${index} año${index > 1 ? 's' : ''} (${item.anio})`;
                        return `<li><span>${etiqueta}:</span> <strong>${item.tasa}%</strong></li>`;
                    }).join('');
                }
                document.getElementById('panel-historial').innerHTML = historialHTML;
                panel.style.display = 'block';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function cerrarPanel() {
            document.getElementById('info-panel').style.display = 'none';
        }

        async function init() {
            try {
                const respIndicadores = await fetch('../data/indicadores.json');
                const dataIndicadores = await respIndicadores.json();

                dataIndicadores.provincias.forEach(p => {
                    datosProvincias[p.nombre] = p;
                });

                // Cargar límites vectoriales oficiales de las provincias argentinas
                const respGeo = await fetch('https://raw.githubusercontent.com/apis-digitales/georef-ar-api/master/data/provincias.json');
                const geoData = await respGeo.json();

                geojsonLayer = L.geoJson(geoData, {
                    style: style,
                    onEachFeature: function(feature, layer) {
                        layer.on({
                            mouseover: highlightFeature,
                            mouseout: resetHighlight,
                            click: seleccionarProvincia
                        });
                    }
                }).addTo(map);

            } catch (err) {
                console.error("Error cargando mapa autónomo:", err);
            }
        }

        init();
    </script>
</body>
</html>
