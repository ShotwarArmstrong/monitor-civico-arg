<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cívico Argentina</title>
    <style>
        :root {
            --primary: #0077b6;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #1d2d44;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 5px solid var(--primary);
        }
        .card h3 { margin-top: 0; color: var(--primary); }
        .metric { font-size: 1.8em; font-weight: bold; margin: 10px 0; }
        .metric-label { font-size: 0.9em; color: #666; }
    </style>
</head>
<body>

    <header>
        <h1>Monitor Cívico Argentina</h1>
        <p>Indicadores públicos e impacto económico transparente</p>
    </header>

    <div class="container">
        <h2>Panel de Indicadores Regionales</h2>
        <div id="indicadores-container" class="grid">
            <p>Cargando datos oficiales del INDEC...</p>
        </div>
    </div>

    <script>
        async function cargarDatos() {
            try {
                const response = await fetch('../data/indicadores.json');
                const data = await response.json();
                
                const container = document.getElementById('indicadores-container');
                container.innerHTML = '';

                data.provincias.forEach(prov => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${prov.nombre}</h3>
                        <div class="metric">${prov.pobreza_porcentaje}%</div>
                        <div class="metric-label">Tasa de Pobreza</div>
                        <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                        <div><strong>Población:</strong> ${prov.poblacion.toLocaleString('es-AR')} hab.</div>
                        <div><strong>Desempleo:</strong> ${prov.desempleo_porcentaje}%</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error al cargar indicadores:", error);
                document.getElementById('indicadores-container').innerHTML = "<p>Error al cargar los datos públicos.</p>";
            }
        }

        cargarDatos();
    </script>
</body>
</html>
