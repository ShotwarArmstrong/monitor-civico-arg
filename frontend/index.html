<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cívico Argentina</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --celeste: #74acdf;
            --blanco: #ffffff;
            --amarillo-sol: #ffb81c;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #1e293b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            /* Fondo propio: Blanco con degradados celestes y un sutil toque dorado */
            background: radial-gradient(circle at 50% 50%, #ffffff 0%, #e0f2fe 50%, #bae6fd 100%);
        }

        /* Marcas de agua decorativas: Las 3 Estrellas */
        .star-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.15;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 100 100"><text x="10" y="30" font-size="20" fill="%23ffb81c">⭐⭐⭐</text></svg>');
        }

        /* Encabezado Principal */
        #header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 30px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            border: 2px solid var(--celeste);
        }
        #header h1 { margin: 0; font-size: 1.3em; letter-spacing: 0.5px; color: #0f172a; }
        #header p { margin: 2px 0 0 0; font-size: 0.8em; color: #0284c7; font-weight: 600; }

        /* Selector de Capas / Indicadores */
        #controls-panel {
            position: absolute;
            top: 85px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            padding: 12px 16px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--celeste);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        #controls-panel label { display: block; font-size: 0.75em; color: #0369a1; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        #controls-panel select {
            background: #f0f9ff;
            color: #0f172a;
            border: 1px solid var(--celeste);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
            background: transparent;
        }

        /* Panel Lateral de Información */
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 380px;
            max-height: calc(100vh - 40px);
            z-index: 1000;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow-y: auto;
            display: none;
            border: 2px solid var(--celeste);
            animation: fadeIn 0.25s ease-in-out;
            color: var(--text);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            color: #64748b;
        }
        .close-btn:hover { color: #000; }
        .province-title { margin: 0 0 15px 0; color: #0284c7; font-size: 1.4em; }

        /* Pestañas */
        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 15px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #64748b;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #0284c7;
            border-bottom-color: #0284c7;
            font-weight: bold;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .metric-box {
            background: #f0f9ff;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            text-align: center;
            border: 1px solid #bae6fd;
        }
        .metric-val { font-size: 1.8em; font-weight: bold; color: #e11d48; }
        .metric-sub { font-size: 0.75em; color: #0369a1; text-transform: uppercase; font-weight: bold; }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            border-bottom: 1px dashed #e2e8f0;
            font-size: 0.88em;
        }
        .history-list { list-style: none; padding: 0; margin: 10px 0 0 0; font-size: 0.85em; }
        .history-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #e2e8f0; }
    </style>
</head>
<body>

    <div class="star-pattern"></div>

    <div id="header">
        <h1>Monitor Cívico Argentina ⭐⭐⭐</h1>
        <p>Selecciona una provincia en el mapa para ver sus indicadores</p>
    </div>

    <div id="controls-panel">
        <label for="indicator-select">Ver en el mapa:</label>
        <select id="indicator-select" onchange="cambiarIndicador()">
            <option value="riesgo">Índice de Riesgo General</option>
            <option value="pobreza">Tasa de Pobreza (%)</option>
            <option value="desempleo">Desempleo Actual (%)</option>
            <option value="poblacion">Población (Habitantes)</option>
        </select>
    </div>

    <div id="map"></div>

    <div id="info-panel">
        <span class="close-btn" onclick="cerrarPanel()">&times;</span>
        <h2 id="panel-nombre" class="province-title">-</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-general')">General</button>
            <button class="tab-btn" onclick="switchTab('tab-empleo')">Economía</button>
            <button class="tab-btn" onclick="switchTab('tab-seguridad')">Seguridad & Salud</button>
        </div>

        <!-- Pestaña 1: General -->
        <div id="tab-general" class="tab-content active">
            <div class="metric-box">
                <div id="panel-riesgo" class="metric-val">- / 100</div>
                <div class="metric-sub">Índice de Riesgo Integral</div>
            </div>
            <div class="data-row"><span>Población Total:</span><strong id="panel-poblacion">-</strong></div>
            <div class="data-row"><span>Tasa de Pobreza:</span><strong id="panel-pobreza">-</strong></div>
        </div>

        <!-- Pestaña 2: Empleo -->
        <div id="tab-empleo" class="tab-content">
            <div class="data-row"><span>Costo Promedio Alquiler:</span><strong id="panel-alquiler">-</strong></div>
            <div style="font-weight: bold; margin: 15px 0 8px 0; font-size: 0.9em; color: #0284c7;">Evolución del Desempleo:</div>
            <ul id="panel-historial" class="history-list"></ul>
        </div>

        <!-- Pestaña 3: Seguridad y Salud -->
        <div id="tab-seguridad" class="tab-content">
            <div class="data-row"><span>Inseguridad (delitos / 100k hab):</span><strong id="panel-inseguridad">-</strong></div>
            <div class="data-row"><span>Tasa de Mortalidad:</span><strong id="panel-mortalidad">-</strong></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa centrado exclusivamente en la Argentina
        let map = L.map('map', {
            zoomControl: false,
            minZoom: 4,
            maxZoom: 7,
            attributionControl: false
        }).setView([-38.416097, -63.616672], 4.5);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let datosProvincias = {};
        let geojsonLayer = null;
        let indicadorActual = 'riesgo';

        function calcularIndiceRiesgo(p) {
            if (!p) return 50;
            const pobr = p.pobreza_porcentaje || 40;
            const desempleo = (p.desempleo_historial && p.desempleo_historial[0]) ? p.desempleo_historial[0].tasa : 6;
            const inseguridad = (p.inseguridad_tasa || 500) / 15;
            let score = (pobr * 0.5) + (desempleo * 2.5) + (inseguridad * 0.2);
            return Math.min(Math.max(Math.round(score), 10), 100);
        }

        function getColor(val, indicador) {
            if (indicador === 'riesgo') {
                return val > 75 ? '#b91c1c' :
                       val > 60 ? '#ef4444' :
                       val > 45 ? '#f97316' :
                       val > 30 ? '#eab308' : '#16a34a';
            } else if (indicador === 'pobreza') {
                return val > 45 ? '#b91c1c' :
                       val > 40 ? '#f97316' :
                       val > 35 ? '#eab308' : '#16a34a';
            } else if (indicador === 'desempleo') {
                return val > 7.5 ? '#b91c1c' :
                       val > 6.5 ? '#f97316' :
                       val > 5.5 ? '#eab308' : '#16a34a';
            } else {
                return val > 10000000 ? '#0284c7' :
                       val > 3000000  ? '#0369a1' :
                       val > 1000000  ? '#075985' : '#38bdf8';
            }
        }

        function style(feature) {
            const nombre = feature.properties.nam || feature.properties.name;
            const provData = datosProvincias[nombre];
            let val = 0;

            if (provData) {
                if (indicadorActual === 'riesgo') val = calcularIndiceRiesgo(provData);
                else if (indicadorActual === 'pobreza') val = provData.pobreza_porcentaje || 0;
                else if (indicadorActual === 'desempleo') val = (provData.desempleo_historial && provData.desempleo_historial[0]) ? provData.desempleo_historial[0].tasa : 0;
                else if (indicadorActual === 'poblacion') val = provData.poblacion || 0;
            }

            return {
                fillColor: getColor(val, indicadorActual),
                weight: 2,
                opacity: 1,
                color: '#ffffff',
                fillOpacity: 0.85
            };
        }

        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 4,
                color: '#ffb81c', // Borde Dorado al pasar el mouse
                fillOpacity: 0.95
            });
            layer.bringToFront();
        }

        function resetHighlight(e) {
            if (geojsonLayer) geojsonLayer.resetStyle(e.target);
        }

        function seleccionarProvincia(e) {
            const feature = e.target.feature;
            const nombreProv = feature.properties.nam || feature.properties.name;
            const data = datosProvincias[nombreProv];

            const panel = document.getElementById('info-panel');
            if (data) {
                const riesgoScore = calcularIndiceRiesgo(data);
                document.getElementById('panel-nombre').innerText = data.nombre;
                document.getElementById('panel-riesgo').innerText = `${riesgoScore} / 100`; document.getElementById('panel-poblacion').innerText = `${data.poblacion.toLocaleString('es-AR')} hab.`;
                document.getElementById('panel-pobreza').innerText = `${data.pobreza_porcentaje}\%`; document.getElementById('panel-alquiler').innerText = `$${data.costo_alquiler.toLocaleString('es-AR')}`; document.getElementById('panel-inseguridad').innerText = `${data.inseguridad_tasa} delitos`;
                document.getElementById('panel-mortalidad').innerText = `${data.mortalidad_tasa} ‰`;  let historialHTML = ''; if (data.desempleo_historial) { historialHTML = data.desempleo_historial.map((item, index) => { const etiqueta = index === 0 ? `Año ${item.anio} (Actual)
