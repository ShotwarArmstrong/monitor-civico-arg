<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cívico Argentina</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #0284c7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
        }

        /* Encabezado Flotante Superior */
        #header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 25px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #header h1 { margin: 0; font-size: 1.2em; letter-spacing: 0.5px; color: #fff; }
        #header p { margin: 2px 0 0 0; font-size: 0.75em; color: var(--text-muted); }

        /* Selector de Capas / Indicadores */
        #controls-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.9);
            padding: 12px 16px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #controls-panel label { display: block; font-size: 0.75em; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        #controls-panel select {
            background: #0f172a;
            color: #fff;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.9em;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
            background: #090d16;
        }

        /* Panel Lateral de Información */
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 360px;
            max-height: calc(100vh - 40px);
            z-index: 1000;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow-y: auto;
            display: none;
            border: 1px solid var(--border);
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-muted);
        }
        .close-btn:hover { color: #fff; }
        .province-title { margin: 0 0 15px 0; color: #38bdf8; font-size: 1.4em; }

        /* Pestañas dentro del Panel */
        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.85em;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
            font-weight: bold;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .metric-box {
            background: #0f172a;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            text-align: center;
            border: 1px solid var(--border);
        }
        .metric-val { font-size: 1.8em; font-weight: bold; color: #f43f5e; }
        .metric-sub { font-size: 0.75em; color: var(--text-muted); text-transform: uppercase; }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.88em;
        }
        .history-list { list-style: none; padding: 0; margin: 10px 0 0 0; font-size: 0.85em; }
        .history-list li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
    </style>
</head>
<body>

    <div id="header">
        <h1>Monitor Cívico Argentina</h1>
        <p>Explora el mapa interactivo y selecciona una provincia</p>
    </div>

    <div id="controls-panel">
        <label for="indicator-select">Ver en el mapa:</label>
        <select id="indicator-select" onchange="cambiarIndicador()">
            <option value="pobreza">Tasa de Pobreza (%)</option>
            <option value="desempleo">Desempleo Actual (%)</option>
            <option value="poblacion">Población (Habitantes)</option>
        </select>
    </div>

    <div id="map"></div>

    <div id="info-panel">
        <span class="close-btn" onclick="cerrarPanel()">&times;</span>
        <h2 id="panel-nombre" class="province-title">-</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-general')">General</button>
            <button class="tab-btn" onclick="switchTab('tab-empleo')">Desempleo</button>
        </div>

        <!-- Pestaña 1: General -->
        <div id="tab-general" class="tab-content active">
            <div class="metric-box">
                <div id="panel-pobreza" class="metric-val">- %</div>
                <div class="metric-sub">Tasa de Pobreza</div>
            </div>
            <div class="data-row">
                <span>Población Total:</span>
                <strong id="panel-poblacion">-</strong>
            </div>
        </div>

        <!-- Pestaña 2: Empleo -->
        <div id="tab-empleo" class="tab-content">
            <div style="font-weight: bold; margin-bottom: 8px; font-size: 0.9em; color: #38bdf8;">Evolución del Desempleo:</div>
            <ul id="panel-historial" class="history-list"></ul>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map', { zoomControl: false }).setView([-38.416097, -63.616672], 4);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Capa de mapa base totalmente abierta (OpenStreetMap estándar)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let datosProvincias = {};
        let geojsonLayer = null;
        let indicadorActual = 'pobreza';

        function getColor(val, indicador) {
            if (indicador === 'pobreza') {
                return val > 45 ? '#e11d48' :
                       val > 40 ? '#f97316' :
                       val > 35 ? '#eab308' :
                       val > 20 ? '#84cc16' : '#22c55e';
            } else if (indicador === 'desempleo') {
                return val > 7.5 ? '#e11d48' :
                       val > 6.5 ? '#f97316' :
                       val > 5.5 ? '#eab308' : '#22c55e';
            } else {
                return val > 10000000 ? '#0284c7' :
                       val > 3000000  ? '#0369a1' :
                       val > 1000000  ? '#075985' : '#0c4a6e';
            }
        }

        function style(feature) {
            const nombre = feature.properties.nam || feature.properties.name;
            const provData = datosProvincias[nombre];
            let val = 0;

            if (provData) {
                if (indicadorActual === 'pobreza') val = provData.pobreza_porcentaje || 0;
                else if (indicadorActual === 'desempleo') val = (provData.desempleo_historial && provData.desempleo_historial[0]) ? provData.desempleo_historial[0].tasa : 0;
                else if (indicadorActual === 'poblacion') val = provData.poblacion || 0;
            }

            return {
                fillColor: getColor(val, indicadorActual),
                weight: 1.5,
                opacity: 1,
                color: '#ffffff',
                dashArray: '3',
                fillOpacity: 0.75
            };
        }

        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 3,
                color: '#38bdf8',
                dashArray: '',
                fillOpacity: 0.95
            });
            layer.bringToFront();
        }

        function resetHighlight(e) {
            if (geojsonLayer) geojsonLayer.resetStyle(e.target);
        }

        function seleccionarProvincia(e) {
            const feature = e.target.feature;
            const nombreProv = feature.properties.nam || feature.properties.name;
            const data = datosProvincias[nombreProv];

            const panel = document.getElementById('info-panel');
            if (data) {
                document.getElementById('panel-nombre').innerText = data.nombre;
                document.getElementById('panel-pobreza').innerText = `${data.pobreza_porcentaje}%`;
                document.getElementById('panel-poblacion').innerText = `${data.poblacion.toLocaleString('es-AR')} hab.`;

                let historialHTML = '';
                if (data.desempleo_historial) {
                    historialHTML = data.desempleo_historial.map((item, index) => {
                        const etiqueta = index === 0 ? `Actual (${item.anio})` : `Hace ${index} año${index > 1 ? 's' : ''} (${item.anio})`;
                        return `<li><span>${etiqueta}:</span> <strong>${item.tasa}%</strong></li>`;
                    }).join('');
                }
                document.getElementById('panel-historial').innerHTML = historialHTML;
                panel.style.display = 'block';
            }
        }

        function cambiarIndicador() {
            indicadorActual = document.getElementById('indicator-select').value;
            if (geojsonLayer) geojsonLayer.setStyle(style);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function cerrarPanel() {
            document.getElementById('info-panel').style.display = 'none';
        }

        async function init() {
            try {
                const respIndicadores = await fetch('../data/indicadores.json');
                const dataIndicadores = await respIndicadores.json();

                dataIndicadores.provincias.forEach(p => {
                    datosProvincias[p.nombre] = p;
                });

                const respGeo = await fetch('https://raw.githubusercontent.com/apis-digitales/georef-ar-api/master/data/provincias.json');
                const geoData = await respGeo.json();

                geojsonLayer = L.geoJson(geoData, {
                    style: style,
                    onEachFeature: function(feature, layer) {
                        layer.on({
                            mouseover: highlightFeature,
                            mouseout: resetHighlight,
                            click: seleccionarProvincia
                        });
                    }
                }).addTo(map);

            } catch (err) {
                console.error("Error cargando mapa e indicadores:", err);
            }
        }

        init();
    </script>
</body>
</html>
